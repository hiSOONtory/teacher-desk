<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 색상 (Apple 시스템 색 기반) ===== */
:root{
  color-scheme:light;
  --bg:#eceff5;
  --blob1:rgba(0,122,255,.16); --blob2:rgba(175,82,222,.12); --blob3:rgba(52,199,89,.10);
  --card:rgba(255,255,255,.76); --sheet:#f2f2f7; --group:#ffffff; --pop:#ffffff;
  --fill:rgba(120,120,128,.14); --fill2:rgba(120,120,128,.08);
  --sep:rgba(60,60,67,.13);
  --text:#1d1d1f; --text2:#55555b; --text3:#8a8a8f;
  --blue:#007aff; --green:#28a745; --red:#ff3b30; --orange:#f08c00; --purple:#a64fd6; --teal:#1f9fb8; --gray:#8e8e93;
  --blueSoft:rgba(0,122,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,30,60,.08);
  --fs:1;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08090c;
  --blob1:rgba(10,132,255,.20); --blob2:rgba(191,90,242,.13); --blob3:rgba(48,209,88,.08);
  --card:rgba(32,32,36,.74); --sheet:#1c1c1e; --group:#2c2c2e; --pop:#2c2c2e;
  --fill:rgba(120,120,128,.30); --fill2:rgba(120,120,128,.18);
  --sep:rgba(84,84,88,.50);
  --text:#f5f5f7; --text2:#b4b4ba; --text3:#7c7c82;
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --teal:#40c8e0; --gray:#98989d;
  --blueSoft:rgba(10,132,255,.18);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:calc(clamp(13px,.88vw,19px) * var(--fs))}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.4}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 760px at 88% -8%,var(--blob1),transparent 62%),
  radial-gradient(900px 700px at 4% 108%,var(--blob2),transparent 60%),
  radial-gradient(800px 600px at 55% 60%,var(--blob3),transparent 65%),
  var(--bg)}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums}

.app{height:100vh;padding:1.7rem 1.9rem var(--gb,56px) var(--gl,100px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.2rem}

/* ===== 상단 ===== */
.top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:stretch}
.when{display:flex;flex-direction:column;justify-content:center;padding-right:.4rem;max-width:24rem}
.dateLbl{font-size:1.15rem;font-weight:600;color:var(--text2)}
.clock{font-size:4.6rem;font-weight:700;line-height:1;letter-spacing:-.045em;margin-top:.15rem}
.greet{margin-top:.5rem;font-size:.92rem;color:var(--text2)}
.status{display:flex;flex-direction:column;justify-content:center;padding:1.15rem 1.6rem}
.status .lbl{font-size:.82rem;font-weight:700;color:var(--blue);letter-spacing:.02em}
.status .ttl{font-size:1.75rem;font-weight:700;letter-spacing:-.025em;margin-top:.15rem}
.status .sub{font-size:1.02rem;color:var(--text2);margin-top:.25rem}
.status .bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:.9rem}
.status .bar i{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .8s}
.status.soon .lbl,.status.soon .ttl{color:var(--orange)}
.status.soon .bar i{background:var(--orange)}
.side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:.7rem}
.tools{display:flex;gap:.45rem}
.round{width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.round:hover{background:var(--group)}
.round svg{width:1.2rem;height:1.2rem}
.round.on{color:#fff;background:var(--orange)}
.ddays{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;max-width:32rem}
.dcap{display:flex;align-items:center;gap:.55rem;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);border-radius:99px;padding:.5rem .95rem;font-size:.95rem;font-weight:600;white-space:nowrap}
.dcap b{color:var(--red);font-weight:800}

/* ===== 카드(위젯) ===== */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:1.2rem;min-height:0}
#pTimeline{grid-column:1;grid-row:1/3}
#pAtt{grid-column:2;grid-row:1/3}
#pProg{grid-column:1;grid-row:1/3}
.subjcards{display:flex;flex-direction:column;gap:1.2rem;min-width:0;min-height:0;width:100%;height:100%}
.subjcards > .w{flex:1 1 0;min-width:0}
.pr.pru{padding:.45rem 0;gap:.55rem;grid-template-columns:2.6rem minmax(0,1fr) auto}
.pr.pru .ptop{margin-bottom:.15rem}
.pr.pru .pdn{white-space:nowrap}
.pr.pru .pnx{margin-top:.1rem;font-size:.88rem}
#pTask{grid-column:3;grid-row:1}
#pCal{grid-column:3;grid-row:2}
.grid.noAtt #pAtt{display:none}
.grid.noAtt #pProg{grid-column:1/3;flex-direction:row}
.w{background:var(--card);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border-radius:24px;box-shadow:var(--shadow);min-width:0;min-height:0;position:relative}
.panel{display:flex;flex-direction:column;padding:1.2rem 1.35rem}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.85rem}
.ph h2{margin:0;font-size:1.12rem;font-weight:700;display:flex;align-items:center;gap:.6rem;letter-spacing:-.02em}
.ico{width:1.75rem;height:1.75rem;border-radius:.5rem;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:1rem;height:1rem}
.ph .meta{font-size:.88rem;color:var(--text2);font-weight:500;white-space:nowrap}
.pb{flex:1;min-height:0;overflow:hidden;user-select:none;-webkit-user-select:none;margin-right:-.4rem;padding-right:.4rem}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--fill2);border-radius:9px}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:9px;border:3px solid transparent;background-clip:padding-box}

/* 빈 화면 안내 */
.empty{height:100%;min-height:8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7rem;color:var(--text2);padding:1rem}
.empty .big{font-size:1.05rem;font-weight:600;color:var(--text)}
.empty p{margin:0;font-size:.92rem;line-height:1.5}
.pill{border:0;border-radius:99px;padding:.55rem 1.15rem;font-weight:600;font-size:.92rem;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.pill.gray{background:var(--fill);color:var(--text)}
.pill.sm{padding:.38rem .85rem;font-size:.84rem}
.pill.red{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.pill:hover{filter:brightness(1.06)}
.pill:disabled{opacity:.35;cursor:default}
.ghost{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;padding:.3rem .2rem}

/* 오늘 수업 */
.prd{display:grid;grid-template-columns:3.7rem minmax(0,1fr) auto;align-items:center;gap:.6rem;padding:.78rem .85rem;border-radius:16px;margin:0 -.35rem}
.prd + .prd{box-shadow:0 -1px 0 var(--sep)}
.prd .pn{font-size:1.18rem;font-weight:700;line-height:1.1}
.prd .pt{font-size:.82rem;color:var(--text2);margin-top:.22rem}
.prd .m{min-width:0}
.prd .l1{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden}
.cls{display:inline-flex;align-items:center;white-space:nowrap;flex:none;padding:.12rem .55rem;border-radius:7px;background:var(--blueSoft);color:var(--blue);font-weight:700;font-size:1rem}
.prd .l2{font-size:.9rem;color:var(--text2);margin-top:.22rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prd.free .l1{color:var(--text3);font-weight:500}
.prd.past .pn,.prd.past .pt,.prd.past .m{opacity:.42}
.prd.now{background:var(--blue);box-shadow:none !important;color:#fff}
.prd.now + .prd{box-shadow:none}
.prd.now .pt,.prd.now .l2{color:rgba(255,255,255,.85)}
.prd.now .cls{background:rgba(255,255,255,.22);color:#fff}
.prd.now.free .l1{color:rgba(255,255,255,.85)}
.prd.next .pn{color:var(--blue)}
.act{display:flex;gap:.4rem;align-items:center}
.cap{font-size:.8rem;font-weight:700;padding:.22rem .6rem;border-radius:99px;background:var(--fill2);color:var(--text2);white-space:nowrap}
.prd.now .cap{background:#fff;color:var(--blue)}
.chip{border:0;font-size:.82rem;font-weight:600;padding:.36rem .75rem;border-radius:99px;background:var(--fill);color:var(--text);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--blue);color:#fff}
.prd.now .chip{background:rgba(255,255,255,.22);color:#fff}
.chip.done{background:transparent;color:var(--green);cursor:default}
.prd.now .chip.done{color:#fff}
.lunch{display:flex;align-items:center;gap:.7rem;color:var(--text3);font-size:.82rem;font-weight:600;margin:.35rem 0}
.lunch::before,.lunch::after{content:"";flex:1;height:1px;background:var(--sep)}
.lunch + .prd{box-shadow:none}
.prd[data-act]{cursor:pointer;transition:background .15s}
.prd[data-act]:not(.now):hover{background:var(--fill2)}
.cap.chg{background:var(--orange);color:#fff}
.tlnav{display:inline-flex;align-items:center;gap:.1rem;background:var(--fill2);border-radius:99px;padding:.15rem}
.tlnav button{border:0;background:none;color:var(--text);font-size:.86rem;font-weight:600;padding:.25rem .6rem;border-radius:99px;cursor:pointer}
.tlnav button:hover{background:var(--fill)}
.tlnav button.away{background:var(--blue);color:#fff}
.dayNote{font-size:.86rem;font-weight:600;color:var(--blue);background:var(--blueSoft);border-radius:12px;padding:.5rem .8rem;margin-bottom:.5rem}
.tip{margin:.9rem .2rem 0;text-align:center}
#pop .add{margin:.2rem 0 .8rem}

/* 출결 */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:.45rem;margin-bottom:.85rem}
.tiles div{background:var(--fill2);border-radius:14px;padding:.5rem .2rem .45rem;text-align:center}
.tiles b{display:block;font-size:1.45rem;font-weight:700;line-height:1.15}
.tiles span{font-size:.78rem;color:var(--text2);font-weight:500}
.t-ok b{color:var(--green)}.t-abs b{color:var(--red)}.t-late b{color:var(--orange)}.t-early b{color:var(--purple)}.t-res b{color:var(--teal)}
.roster{display:grid;grid-template-columns:repeat(10,1fr);gap:.32rem}
.rc{height:2.2rem;border-radius:10px;border:0;background:var(--fill2);color:var(--text2);font-size:.92rem;font-weight:600;cursor:pointer;padding:0}
.rc:hover{background:var(--fill);color:var(--text)}
.rc.abs{background:var(--red);color:#fff}.rc.late{background:var(--orange);color:#fff}.rc.early{background:var(--purple);color:#fff}.rc.res{background:var(--teal);color:#fff}
.lst{margin-top:.8rem}
.li{display:flex;align-items:center;gap:.6rem;padding:.42rem 0;font-size:.95rem}
.li + .li{border-top:1px solid var(--sep)}
.dot{width:.6rem;height:.6rem;border-radius:50%;flex:none}
.li .sub{color:var(--text2)}
.li .r{margin-left:auto}
.subhead{font-size:.82rem;font-weight:700;color:var(--orange);margin:.9rem 0 .2rem}
.hint{font-size:.86rem;color:var(--text2)}
.w.masked .pb{filter:blur(12px);pointer-events:none;user-select:none}
.w.masked::after{content:"가림 모드";position:absolute;inset:3.4rem 0 0;display:grid;place-items:center;font-weight:700;color:var(--text2)}

/* 팝오버 */
#pop{position:fixed;z-index:60;width:17rem;background:var(--pop);border-radius:18px;padding:1rem;box-shadow:0 20px 50px rgba(0,0,0,.25),0 0 0 .5px var(--sep);display:none}
#pop.open{display:block}
#pop h3{margin:0 0 .7rem;font-size:1.05rem}
#pop .lb{font-size:.8rem;color:var(--text2);font-weight:600;margin-bottom:.35rem}
.segs{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem}
.segs button{border:0;border-radius:99px;padding:.38rem .8rem;background:var(--fill2);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer}
.segs button.sel{background:var(--blue);color:#fff}
.segs button:disabled{opacity:.35;cursor:default}
.popf{display:flex;justify-content:space-between;gap:.4rem;margin-top:.2rem}

/* 진도 */
.sg{font-size:.85rem;font-weight:700;color:var(--text2);margin:.1rem 0 .3rem}
.sg ~ .sg{margin-top:.9rem}
.pr{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:.75rem;align-items:center;padding:.55rem 0}
.pr + .pr{border-top:1px solid var(--sep)}
.pr .c{font-size:1.05rem;font-weight:700}
.pbar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--green)}
.pinf{display:flex;justify-content:space-between;gap:.6rem;margin-top:.35rem;font-size:.86rem;color:var(--text2)}
.pinf .nx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinf .n{white-space:nowrap}
.lag{color:var(--orange);font-weight:700}
.pm{display:flex;gap:.3rem}
.pm button{width:2rem;height:2rem;border-radius:50%;border:0;background:var(--fill2);color:var(--text);cursor:pointer;font-size:1.15rem;font-weight:500;line-height:1;padding:0}
.pm button:hover{background:var(--blue);color:#fff}

/* 업무 (미리 알림 스타일) */
.th{font-size:.85rem;font-weight:700;color:var(--text2);margin:.75rem 0 .15rem}
.th:first-child{margin-top:0}
.th.over{color:var(--red)}
.tk{display:flex;align-items:center;gap:.7rem;padding:.5rem 0}
.tk + .tk{border-top:1px solid var(--sep)}
.ring{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--text3);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
.ring:hover{border-color:var(--blue)}
.ring.on{background:var(--blue);border-color:var(--blue)}
.ring svg{width:.8rem;height:.8rem}
.tk .tt{flex:1;min-width:0;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.done .tt{color:var(--text3);text-decoration:line-through}
.tk .due{font-size:.86rem;color:var(--text2);white-space:nowrap}
.tk .due.over{color:var(--red);font-weight:600}
.tk .x{border:0;background:none;color:var(--text3);cursor:pointer;font-size:1.2rem;padding:0 .15rem;opacity:0}
.tk:hover .x{opacity:1}
.add{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.inp{border:0;background:var(--fill2);color:var(--text);border-radius:10px;padding:.55rem .75rem;font-size:.95rem;min-width:0;width:100%;outline:none;transition:box-shadow .15s}
.inp:focus{box-shadow:0 0 0 3px var(--blueSoft),inset 0 0 0 1.5px var(--blue)}
.inp::placeholder{color:var(--text3)}
.add .t{flex:1 1 100%}.add .d{flex:1 1 8rem;min-width:0}.add .h{flex:1 1 6.5rem;min-width:0}
.add .inp{font-size:.88rem;padding:.5rem .65rem}

/* 학사일정 */
.calw{display:grid;grid-template-columns:minmax(12.5rem,15rem) minmax(0,1fr);gap:1.2rem;flex:1;min-height:0}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.mh b{font-size:.95rem;font-weight:800;color:var(--red)}
.mh button{border:0;background:none;color:var(--text2);cursor:pointer;font-size:1.15rem;padding:0 .45rem;border-radius:8px;line-height:1.4}
.mh button:hover{background:var(--fill2)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.1rem;text-align:center;font-size:.86rem;font-weight:500}
.mg .wh{font-size:.74rem;color:var(--text3);font-weight:700;padding:.15rem 0 .25rem}
.mg .d{position:relative;height:2rem;display:grid;place-items:center}
.mg .d span{width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center}
.mg .d.o{opacity:.28}
.mg .d.sun,.mg .d.hol{color:var(--red)}
.mg .d.sat{color:var(--blue)}
.mg .d.today span{background:var(--red);color:#fff;font-weight:800}
.mg .d i{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.mg .d i em{width:4px;height:4px;border-radius:50%}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.5rem 0}
.ev + .ev{border-top:1px solid var(--sep)}
.ev .et{display:flex;align-items:center;gap:.55rem;min-width:0}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .tx{min-width:0}
.ev .t1{font-size:.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t2{font-size:.82rem;color:var(--text2)}
.ev .dd{font-size:.88rem;font-weight:700;color:var(--text2);white-space:nowrap}
.ev .dd.soon{color:var(--red)}
.ev .dd.ing{color:var(--green)}

/* 알림 배너 */
#banner{position:fixed;left:50%;top:1.5rem;transform:translate(-50%,-170%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1.12),visibility .5s;z-index:80;width:min(31rem,90vw);background:var(--card);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.28),0 0 0 .5px var(--sep);padding:1rem 1.1rem;display:flex;gap:.95rem;align-items:center}
#banner.show{transform:translate(-50%,0);visibility:visible}
#banner .appi{width:3rem;height:3rem;border-radius:.85rem;background:linear-gradient(160deg,#ffb340,#ff8a00);display:grid;place-items:center;color:#fff;flex:none;animation:ring 1.5s ease-in-out infinite}
#banner .appi svg{width:1.55rem;height:1.55rem}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}}
#banner .bt{flex:1;min-width:0}
#banner .b0{font-size:.76rem;color:var(--text2);font-weight:600}
#banner .b1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
#banner .b2{font-size:1rem;color:var(--text);margin-top:.1rem}
#banner .b3{font-size:.86rem;color:var(--text2);margin-top:.1rem}

/* ===== 시트(설정·안내) ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;z-index:90}
.scrim.open{display:grid}
.sheet{background:var(--sheet);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 .5px var(--sep);overflow:hidden}
#settings .sheet{width:min(74rem,95vw);height:min(48rem,92vh);display:grid;grid-template-columns:13rem minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.nav{grid-row:1/3;padding:1.1rem .7rem;border-right:1px solid var(--sep);display:flex;flex-direction:column;gap:.15rem;background:var(--sheet)}
.nav .navt{font-size:1.25rem;font-weight:800;padding:.2rem .6rem .8rem}
.nav button{display:flex;align-items:center;gap:.65rem;border:0;background:none;color:var(--text);font-size:.95rem;font-weight:500;padding:.48rem .6rem;border-radius:9px;cursor:pointer;text-align:left}
.nav button .ico{width:1.6rem;height:1.6rem;border-radius:.45rem}
.nav button.sel{background:var(--blue);color:#fff}
.body{overflow:auto;padding:1.6rem 2rem 1.2rem;min-height:0}
.drop{display:flex;align-items:center;gap:1rem;border:2px dashed var(--sep);border-radius:16px;padding:1.1rem 1.2rem;background:var(--group);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blueSoft)}
.drop .ico{width:2.7rem;height:2.7rem;border-radius:.75rem}
.drop .ico svg{width:1.45rem;height:1.45rem}
.drop b{display:block;font-size:1.05rem}
.drop .h{font-size:.86rem;color:var(--text2)}
.drop input{display:none}
details.paste summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:.92rem;margin:.75rem .3rem;list-style:none}

.impBar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:.9rem .2rem .5rem;flex-wrap:wrap}
.impMsg{font-size:.95rem;font-weight:600;margin:.9rem .2rem .3rem}

.impMsg.ok{color:var(--green)}
.imp{max-height:21rem;overflow:auto}
.imp .row{justify-content:flex-start;min-height:2.7rem;padding:.45rem 1rem;cursor:pointer}
.imp .row input{width:1.15rem;height:1.15rem;accent-color:var(--blue);flex:none;margin:0}
.imp .dt{width:10.5rem;flex:none;font-size:.9rem;color:var(--text2)}
.imp .tl{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.76rem;font-weight:700;padding:.16rem .55rem;border-radius:99px;color:#fff;flex:none}
.foot{grid-column:2;padding:.85rem 1.4rem;border-top:1px solid var(--sep);display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--sheet)}
.foot .err{color:var(--red);font-size:.9rem;font-weight:600}
.foot .btns{display:flex;gap:.5rem;margin-left:auto}
.steps{display:flex;gap:.4rem;align-items:center;font-size:.88rem;color:var(--text2);font-weight:600}
.steps i{width:.55rem;height:.55rem;border-radius:50%;background:var(--fill)}
.steps i.on{background:var(--blue)}
#settings .sheet.wiz{grid-template-columns:minmax(0,1fr)}
#settings .sheet.wiz .nav{display:none}
#settings .sheet.wiz .foot{grid-column:1}
.pane{display:none}.pane.sel{display:block}
.pane h1{margin:0 0 .3rem;font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
.pane .lead{margin:0 0 1.3rem;color:var(--text2);font-size:.98rem;line-height:1.55}
.gl{font-size:.8rem;font-weight:700;color:var(--text2);margin:1.2rem 0 .4rem .9rem;letter-spacing:.02em}
.gl:first-of-type{margin-top:0}
.grp{background:var(--group);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1rem;min-height:3.1rem}
.row + .row{border-top:1px solid var(--sep)}
.row > label,.row > .rl{font-size:.98rem;font-weight:500}
.row .rh{display:block;font-size:.82rem;color:var(--text2);font-weight:400;margin-top:.1rem}
.row .rv{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.row.col{flex-direction:column;align-items:stretch;gap:.5rem}
.gfoot{font-size:.84rem;color:var(--text2);margin:.45rem .9rem 0;line-height:1.5}
textarea.inp{min-height:8rem;resize:vertical;line-height:1.6}
select.inp{width:auto;padding-right:2rem}
.sw{position:relative;display:inline-block;width:3.1rem;height:1.9rem;flex:none}

.sw span::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked + span{background:var(--green)}

.seg{display:inline-flex;background:var(--fill2);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--text);font-size:.9rem;font-weight:500;padding:.38rem .95rem;border-radius:8px;cursor:pointer}
.seg button.sel{background:var(--group);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:700}
:root[data-theme="dark"] .seg button.sel{background:#636366}
.tt{width:100%;border-collapse:separate;border-spacing:.35rem}
.tt th{font-size:.85rem;color:var(--text2);font-weight:700;padding-bottom:.1rem}
.tt td.pn{font-weight:800;text-align:center;width:2.2rem;font-size:1rem}
.tt td.tm{white-space:nowrap;width:17.5rem}
.tt td.tm .inp{width:8rem;padding:.45rem .45rem;font-size:.86rem}
.tt .inp{padding:.5rem .55rem;font-size:.9rem}
.presets{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.subj{margin-bottom:1.2rem}
.cnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.45rem}
.cnt label{display:flex;align-items:center;justify-content:space-between;gap:.4rem;background:var(--fill2);border-radius:10px;padding:.35rem .35rem .35rem .7rem;font-weight:700;font-size:.92rem}
.cnt .inp{width:4.2rem;padding:.35rem .4rem;text-align:right;background:var(--group)}
.help ol{margin:.2rem 0 0;padding-left:1.3rem;line-height:1.75;font-size:.98rem}
.help li{margin-bottom:.25rem}
.help .k{display:inline-block;background:var(--fill2);border-radius:6px;padding:0 .45rem;font-size:.88rem;font-weight:600}

/* 첫 실행 안내 */
#welcome .sheet{width:min(34rem,92vw);padding:2.4rem 2.4rem 1.8rem;text-align:center}
.appIcon{width:5rem;height:5rem;border-radius:1.25rem;margin:0 auto 1rem;background:linear-gradient(160deg,#5ac8fa,#007aff 55%,#5856d6);display:grid;place-items:center;color:#fff;box-shadow:0 10px 25px rgba(0,122,255,.35)}
.appIcon svg{width:2.6rem;height:2.6rem}
#welcome h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
#welcome .lead{margin:.4rem 0 1.6rem;color:var(--text2);font-size:1.02rem}
.feat{display:flex;gap:.95rem;align-items:flex-start;text-align:left;margin-bottom:1.05rem}
.feat .ico{width:2.4rem;height:2.4rem;border-radius:.7rem}
.feat .ico svg{width:1.3rem;height:1.3rem}
.feat b{display:block;font-size:1rem}
.feat span{font-size:.9rem;color:var(--text2)}
#welcome .pill{width:100%;padding:.85rem;font-size:1.02rem;margin-top:.8rem}
#welcome .note{margin-top:1rem;font-size:.84rem;color:var(--text2);line-height:1.55}

#tip{position:fixed;z-index:120;display:none;max-width:22rem;padding:.4rem .65rem;border-radius:9px;background:var(--pop);color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.18),0 0 0 .5px var(--sep);font-size:.8rem;line-height:1.4;white-space:pre-line;pointer-events:none}
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--pop);box-shadow:0 10px 30px rgba(0,0,0,.2),0 0 0 .5px var(--sep);padding:.7rem 1.2rem;border-radius:99px;font-size:.95rem;font-weight:600;opacity:0;transition:all .3s;z-index:100;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1000px){
  body{overflow:auto}
  .app{height:auto;padding:1rem}
  .top{grid-template-columns:1fr}
  .side{align-items:flex-start}
  .grid{display:flex;flex-direction:column}
  .panel{min-height:20rem}
  .calw{grid-template-columns:1fr}
  #settings .sheet{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .nav{grid-row:auto;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--sep)}
  .nav .navt{display:none}
  .foot{grid-column:1}
}

/* ===== 다듬은 디자인: 시간대별 바탕 + 유리 위젯 ===== */
:root{ --w1:#8ec3ff; --w2:#a8ecd9; --w3:#d6c8ff; --wb:#e9f0fa;
  --glass:rgba(255,255,255,.60); --glassHi:rgba(255,255,255,.75); --edge:rgba(255,255,255,.65);
  --shadow:0 1px 1px rgba(20,30,60,.04),0 12px 40px rgba(30,45,90,.12); }
:root[data-theme="dark"]{ --glass:rgba(30,32,40,.58); --glassHi:rgba(44,46,56,.7); --edge:rgba(255,255,255,.09);
  --shadow:0 12px 40px rgba(0,0,0,.35); }
body{background:var(--wb)}
body::before{background:
  radial-gradient(60% 75% at 92% -5%, var(--w1), transparent 68%),
  radial-gradient(55% 70% at -5% 105%, var(--w2), transparent 68%),
  radial-gradient(45% 55% at 55% 45%, var(--w3), transparent 72%),
  var(--wb);
  transition:background 2s}
.w{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow);border-radius:26px}
.round{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.round:hover{background:var(--glassHi)}

/* 시계 */
.when{padding-left:.2rem}
.dateLbl{font-size:1.2rem;font-weight:600;color:var(--text);opacity:.72;letter-spacing:-.01em}
.clock{font-size:5.4rem;font-weight:700;letter-spacing:-.055em;line-height:.95;margin-top:.1rem}
.greet{font-size:.95rem;color:var(--text);opacity:.68;margin-top:.55rem}

/* 지금 (실시간 현황) */
.status{display:grid !important;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.4rem;padding:1.05rem 1.6rem 1.05rem 1.15rem !important}
.dial{position:relative;width:5.6rem;height:5.6rem;flex:none;--rc:var(--blue)}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:9}
.dial .trk{stroke:var(--fill)}
.dial .fg{stroke:var(--rc);stroke-linecap:round;transition:stroke-dashoffset .9s ease,stroke .4s}
.dial .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dial .rt b{font-size:1.65rem;font-weight:800;letter-spacing:-.04em}
.dial .rt span{font-size:.68rem;font-weight:600;color:var(--text2);margin-top:.2rem}
.dial .rt i{color:var(--rc);display:grid}
.dial .rt i svg{width:1.8rem;height:1.8rem;transform:none}
.status[data-tone="class"] .dial{--rc:var(--blue)}
.status[data-tone="soon"] .dial{--rc:var(--orange)}
.status[data-tone="break"] .dial{--rc:var(--green)}
.status[data-tone="free"] .dial{--rc:var(--teal)}
.status[data-tone="idle"] .dial{--rc:var(--purple)}
.status[data-tone="done"] .dial{--rc:var(--green)}
.status .lbl{font-size:.88rem;font-weight:700;color:var(--blue);letter-spacing:0}
.status[data-tone="soon"] .lbl,.status[data-tone="soon"] .ttl{color:var(--orange)}
.status[data-tone="break"] .lbl,.status[data-tone="done"] .lbl{color:var(--green)}
.status[data-tone="free"] .lbl{color:var(--teal)}
.status[data-tone="idle"] .lbl{color:var(--purple)}
.status .ttl{font-size:1.9rem;font-weight:800;letter-spacing:-.035em;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .sub{font-size:1rem;color:var(--text2);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dtt{display:flex;gap:.4rem;margin-top:.6rem;min-width:0}
.dtt:empty{display:none}
.dti{flex:1 1 0;min-width:0;padding:.4rem .5rem;border-radius:12px;background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--edge);cursor:pointer}
.dti .p{font-size:.72rem;font-weight:700;color:var(--text2);white-space:nowrap}
.dti .c{font-size:.92rem;font-weight:700;margin-top:.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dti .t{font-size:.7rem;color:var(--text3)}
.dti.free .c{color:var(--text3);font-weight:500}
.dti.past{opacity:.55}
.dti.now{background:var(--blue);color:#fff;box-shadow:none;opacity:1}
.dti.now .p,.dti.now .t{color:rgba(255,255,255,.85)}
.dti.next{box-shadow:inset 0 0 0 2px var(--blue)}
.dti.dtlunch{flex:.55 1 0;cursor:default;background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.dnav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;flex:none}
.dnav button{border:0;background:var(--fill2);color:var(--text2);font:inherit;font-size:.74rem;font-weight:700;border-radius:8px;padding:.15rem .45rem;cursor:pointer;white-space:nowrap}
.dnav button.away{background:var(--blue);color:#fff}
.dchg{font-size:.66rem;color:var(--orange)}
.dti.chg{box-shadow:inset 0 0 0 1.5px var(--orange)}
.tkall{cursor:pointer}
.tkall small{font-size:.74rem;font-weight:600;color:var(--text3)}
.pb.calw{grid-template-columns:minmax(10rem,12.5rem) minmax(0,1fr);gap:1rem;align-items:start}
#wkCal{cursor:pointer}
#wkCal .mg .d{height:1.55rem}
#wkCal .mg .d span{width:1.45rem;height:1.45rem}
#pop.calbig{width:min(70rem,94vw);max-height:94vh;overflow:auto;left:50% !important;top:50% !important;transform:translate(-50%,-50%)}
.cwr{display:grid;grid-template-columns:16rem minmax(0,1fr);gap:1.4rem;align-items:center;padding:.3rem .6rem;border-top:1px solid var(--sep)}
.cwr.cwh{border-top:0;padding-bottom:0}
.cwr.now{background:var(--blueSoft);border-radius:12px;border-top-color:transparent}
.cwl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.4rem}
.cwl .ev.ev1{padding:.28rem 0}
.ev.ev1{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:.55rem;padding:.42rem 0}
.ev.ev1 .bar{width:4px;height:1.2rem;border-radius:3px}
.ev.ev1 .t1{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.ev1 .t2{font-size:.78rem;color:var(--text2);white-space:nowrap}
.tkpop{max-height:min(30rem,62vh);overflow:auto}
.tkpop .tk{padding:.6rem 0}
.tkf{flex:1;min-width:0}
.tkf .tt{font-size:1rem;white-space:normal}
.tkx{font-size:.8rem;color:var(--text2);margin-top:.15rem}
.dmemo{display:inline-block;width:.42rem;height:.42rem;border-radius:50%;background:var(--orange);vertical-align:middle}
.dti .da{display:flex;gap:.2rem;margin-top:.25rem}
.dtb{border:0;border-radius:7px;background:var(--blueSoft);color:var(--blue);font:inherit;font-size:.68rem;font-weight:700;padding:.12rem .35rem;cursor:pointer;white-space:nowrap}
.dti.now .dtb{background:rgba(255,255,255,.25);color:#fff}
.dtb.on{background:transparent;color:inherit;padding:.12rem 0}
.upn{display:flex;gap:.5rem;align-self:stretch;align-items:center}
.upn:empty{display:none}
.upn .ui{min-width:7.2rem;padding:.55rem .8rem;border-radius:16px;background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--edge)}
.upn .ui .p{font-size:.78rem;font-weight:700;color:var(--text2)}
.upn .ui .c{font-size:1.02rem;font-weight:700;margin-top:.1rem;white-space:nowrap}
.upn .ui .t{font-size:.78rem;color:var(--text2);margin-top:.05rem}
.upn .ui.free .c{color:var(--text3);font-weight:500}
/* D-day */
.ddays{gap:.55rem}
.dcap{display:flex;flex-direction:column;align-items:flex-start;gap:.05rem;padding:.55rem .95rem .6rem;border-radius:18px;min-width:6.4rem;font-weight:600}
.dcap span{font-size:.8rem;color:var(--text2);max-width:9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcap b{font-size:1.35rem;font-weight:800;color:var(--red);letter-spacing:-.03em;line-height:1.1}
.sthd{display:flex;align-items:flex-start;gap:1rem;min-width:0}
.stt{flex:1;min-width:0}
.sthd .side{flex-direction:row;align-items:center;justify-content:flex-end;gap:.6rem;flex:none}
.sthd .ddays{flex-wrap:nowrap}
.sthd .dcap.w{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--edge);backdrop-filter:none;-webkit-backdrop-filter:none;padding:.35rem .8rem .4rem;min-width:5.4rem;border-radius:14px}
.sthd .dcap b{font-size:1.15rem}
.pals{display:flex;align-items:flex-end;gap:.15rem;flex:none;align-self:center}
.pals img{height:4.3rem;width:auto}

/* 위젯 머리 */
.ph{margin-bottom:.95rem}
.ph h2{font-size:1.08rem;font-weight:700;gap:.55rem}
.ico.tint{width:1.9rem;height:1.9rem;border-radius:50%;background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c)}
.ico.tint svg{width:1.05rem;height:1.05rem}
.ph .meta{color:var(--text2)}
.tlnav{background:var(--fill2)}

/* 오늘 수업 */
.prd{border-radius:18px;padding:.8rem .9rem}
.prd + .prd{box-shadow:0 -1px 0 var(--sep)}
.prd.now{background:linear-gradient(135deg,#1a8cff,#0a63e8);box-shadow:0 8px 22px rgba(10,110,255,.32) !important}
:root[data-theme="dark"] .prd.now{background:linear-gradient(135deg,#0a84ff,#2a5bd7)}
.prd.next .pn{color:var(--blue)}
.cls{border-radius:8px;padding:.14rem .55rem}
.chip{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--sep)}
.prd.now .chip{box-shadow:none}

/* 출결 · 진도 · 업무 */
.tiles div{background:var(--glassHi);border-radius:16px;box-shadow:inset 0 0 0 1px var(--edge)}
.rc{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--sep);border-radius:11px}
.rc:hover{background:var(--group)}
.pbar{height:7px;background:var(--fill)}
.pbar i{background:linear-gradient(90deg,#34c759,#30d1a0)}
.pm button{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--sep)}
.add .inp,.inp{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--sep)}
.add .inp:focus,.inp:focus{box-shadow:0 0 0 3px var(--blueSoft),inset 0 0 0 1.5px var(--blue)}
.mg .d.today span{box-shadow:0 4px 10px rgba(255,59,48,.35)}
.cap{background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--sep)}
.prd.now .cap{box-shadow:none}
.cap.chg{box-shadow:none}

/* 알림 배너 · 팝오버 · 설정 */
#banner{background:var(--glass);border:1px solid var(--edge)}
#pop{border:1px solid var(--edge);border-radius:20px}
.sheet{border-radius:24px}

/* ===== 급식 · 메모 · 공지 · 진도 안내 · 출결 누적 ===== */
.meal{display:flex;gap:.7rem;align-items:flex-start;margin:.15rem 0 .55rem;padding:.7rem .85rem;border-radius:16px;background:var(--glassHi);box-shadow:inset 0 0 0 1px var(--edge)}
.meal .ico.tint{width:1.8rem;height:1.8rem;flex:none}
.meal .mt{min-width:0}
.meal .mh2{display:flex;gap:.5rem;align-items:baseline;font-size:.86rem}
.meal .mh2 span{color:var(--text2);font-size:.78rem}
.meal .mm{font-size:.9rem;color:var(--text2);margin-top:.15rem;line-height:1.45}
.meal + .prd{box-shadow:none}
.memo{display:inline-flex;align-items:center;gap:.35rem;margin-top:.35rem;padding:.2rem .6rem .2rem .45rem;border-radius:99px;background:color-mix(in srgb, var(--orange) 15%, transparent);color:var(--orange);font-size:.84rem;font-weight:600;max-width:100%}
.memo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo i{display:grid;flex:none}.memo i svg{width:.9rem;height:.9rem}
.memo.done{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green)}
.memo.done span{text-decoration:line-through;opacity:.8}
.prd.now .memo{background:rgba(255,255,255,.95);color:#c25e00}
#pop{width:21rem}
#pop h3 .hint{font-weight:500}
.ptabs{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin-bottom:.75rem}
.ptabs button{flex:1;border:0;background:none;color:var(--text);font-size:.86rem;font-weight:600;padding:.4rem;border-radius:8px;cursor:pointer}
.ptabs button.sel{background:var(--group);box-shadow:0 1px 4px rgba(0,0,0,.14)}
:root[data-theme="dark"] .ptabs button.sel{background:#636366}
.segs.mm2 button.sel{background:var(--text);color:var(--group)}
.okbox{margin:.2rem 0 1rem;padding:.75rem 1rem;border-radius:14px;background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--text);font-size:.92rem;line-height:1.5}
.grp.pick .row{width:100%;border:0;background:none;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.grp.pick .row:hover{background:var(--fill2)}
.grp.pick{margin:.6rem 0 0}
.sg{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.sg .np{font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .np b{color:var(--red)}
.ghost.sm{font-size:.82rem;padding:0}

// 화면을 맞추고, 옛날 상태로 덮어쓰지 않게 한다.
let pressedAt = 0;   // 누르는 중에 칸을 다시 그리면 누른 단추가 바뀌어 클릭이 사라진다 → 뗄 때까지 미룬다

// Lively는 휠을 넘겨주지 않고 누르기·움직이기·떼기만 넘겨준다 →
//  · 목록을 잡고 끌면(휴대폰처럼) 따라 움직이고, 놓으면 조금 더 미끄러진다. 6px 안쪽이면 평소 클릭.
//  · 스크롤바를 누르면 그 자리로 부드럽게 가고, 누른 채 움직이면 따라온다.
const scroller = el => { for (; el instanceof Element && el !== document.body; el = el.parentElement) if (el.scrollHeight > el.clientHeight + 4 && /(auto|scroll)/.test(getComputedStyle(el).overflowY)) return el; return null; };
const barTop = (el, y) => { const r = el.getBoundingClientRect(); return (y - r.top) / r.height * el.scrollHeight - el.clientHeight / 2; };
let drag = null, eatClickUntil = 0;
document.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const el = scroller(e.target); if (!el) return;
  const r = el.getBoundingClientRect();
  if (e.target === el && e.clientX >= r.left + el.clientLeft + el.clientWidth) {   // 스크롤바
    e.preventDefault(); drag = { el, bar:true }; el.scrollTo({ top:barTop(el, e.clientY), behavior:"smooth" }); return;
  }
  if (e.target.closest("input,textarea,select")) return;
  drag = { el, y0:e.clientY, top0:el.scrollTop, moved:false, v:0, y:e.clientY, t:performance.now() };
}, true);
document.addEventListener("mousemove", e => {
  if (!drag) return;
  if (!(e.buttons & 1)) { drag = null; return; }
  if (drag.bar) { drag.el.scrollTop = barTop(drag.el, e.clientY); return; }
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) < 6) return;
  drag.moved = true; drag.el.scrollTop = drag.top0 - dy;
  const t = performance.now(); drag.v = (drag.y - e.clientY) / Math.max(8, t - drag.t) * 16; drag.y = e.clientY; drag.t = t;
}, { passive:true });
document.addEventListener("mouseup", () => {
  if (drag && drag.moved) {
    eatClickUntil = performance.now() + 80;   // 끌고 놓은 건 클릭이 아니다
    const el = drag.el; let v = Math.max(-60, Math.min(60, drag.v));
    (function glide(){ if (Math.abs(v) < .4) return; el.scrollTop += v; v *= .93; requestAnimationFrame(glide); })();
  }
  drag = null;
});
document.addEventListener("click", e => { if (performance.now() < eatClickUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
// 마우스를 올리면 뜨는 기본 말풍선(title)은 윈도우의 작은 창이라 다른 프로그램 위에도 뜬다(Lively는 마우스 움직임을
// 늘 넘겨줘서, 다른 창 뒤에 깔린 대시보드에도 말풍선이 생긴다). → 페이지 안에 그리는 말풍선으로 바꾼다(다른 창 뒤에선 안 보임).
const tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip);
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[title],[data-tip]");
  if (el && el.title) { el.dataset.tip = el.title; el.removeAttribute("title"); }
  const t = el ? el.dataset.tip : "";

  tip.style.top = (e.clientY + 22 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 22) + "px";

function prune(){
  const T = ymd(now());
  for (const k of Object.keys(S.plog)) if (dayDiff(k.split("|")[0], T) > 14) delete S.plog[k];
  S.tasks = S.tasks.filter(t => !(t.done && dayDiff(t.due, T) > 30));
  for (const k of Object.keys(S.ovr)) if (dayDiff(k, T) > 14) delete S.ovr[k];
  for (const k of Object.keys(S.memos)) if (dayDiff(k.split("|")[0], T) > 30) delete S.memos[k];
  for (const k of Object.keys(S.memoDone)) if (dayDiff(k.split("|")[0], T) > 14) delete S.memoDone[k];
  for (const k of Object.keys(S.meal)) if (dayDiff(k, T) > 14) delete S.meal[k];
  for (const o of [S.attOk, S.attNeis, S.attNeisItems]) for (const k of Object.keys(o)) if (dayDiff(k, T) > 60) delete o[k];
  S.notice.items = S.notice.items.filter(x => !x.until || dayDiff(x.until, T) <= 1);

function parseSlot(s){
  s = (s || "").trim(); if (!s) return null;
  let room = ""; const at = s.indexOf("@");
  if (at >= 0) { room = s.slice(at+1).trim(); s = s.slice(0, at).trim(); }
  const sp = s.split(/\s+/).filter(Boolean);
  return { cls: sp[0] || "", subj: sp.slice(1).join(" "), room };
}
const slotName = s => s.subj ? `${s.cls} ${s.subj}` : s.cls;
function hasTimetable(){ return [1,2,3,4,5].some(w => (S.timetable[w] || []).some(x => (x || "").trim())); }
function eventsOn(T){ return S.events.filter(e => T >= e.start && T <= (e.end || e.start)); }
function todayPlan(t){
  const wd = t.getDay();
  if (wd === 0 || wd === 6) return { off:"주말" };
  const off = eventsOn(ymd(t)).find(e => e.type === "휴일" || e.type === "방학");
  if (off) return { off: off.title };
  const row = S.timetable[wd] || [], o = S.ovr[ymd(t)] || {};
  return { periods: S.bells.map((b,i) => {
      const ch = Object.prototype.hasOwnProperty.call(o, i+1);
      return { p:i+1, s:b[0], e:b[1], start:toMin(b[0]), end:toMin(b[1]), slot:parseSlot(ch ? o[i+1] : row[i]), changed:ch, base:(row[i] || "").trim() };
    }).filter(x => x.start != null && x.end != null) };
}
const AUTO_HIDE = /(창체|자율|동아리|봉사|진로활동|자치|스포츠클럽|창의적|조회|종례)/;
const subjHidden = sub => S.hidden.includes(sub) || (AUTO_HIDE.test(sub) && !(S.shown || []).includes(sub));
function progressPairs(){
  const set = new Map();

    if (s && s.subj && !subjHidden(s.subj)) set.set(`${s.cls}|${s.subj}`, { cls:s.cls, subj:s.subj });

}
function allSubjects(){

  for (let w = 1; w <= 5; w++) (S.timetable[w] || []).forEach(x => { const s = parseSlot(x); if (s && s.subj) set.add(s.subj); });

function computeStatus(t){

const NEIS = "https://open.neis.go.kr/hub/";
// 인증키가 없으면 나이스는 페이지 번호를 무시하고 늘 앞의 5건만 준다(2026-10 실제 서버에서 확인).
// 그래서 키가 없을 때 기간(…FROM_YMD ~ …TO_YMD)이 있는 요청은 5건 이하가 될 때까지 기간을 반씩 나눠 받는다.
// 하루 안에서 5건이 넘으면(학급 시간표 6교시~) 더 나눌 수 없어서 out.partial 로 알린다.
async function neisGet(svc, params, maxPages){
  const key = (S.neis.key || "").trim(), size = key ? 100 : 5, out = [];
  const one = async (pr, page) => {
    const q = new URLSearchParams(Object.assign({ Type:"json", pIndex:page, pSize:size }, key ? { KEY:key } : {}, pr));
    let j;
    try { const r = await fetch(NEIS + svc + "?" + q.toString(), { cache:"no-store" }); if (!r.ok) throw 0; j = await r.json(); }
    catch(e) { throw new Error("neisNet"); }
    if (j.RESULT) { if (j.RESULT.CODE === "INFO-200") return { rows:[], total:0 }; throw new Error(j.RESULT.MESSAGE || "neis"); }
    const body = j[svc]; if (!body || !body[1]) return { rows:[], total:0 };
    return { rows:body[1].row || [], total:body[0].head[0].list_total_count };
  };
  const fk = Object.keys(params).find(k => /FROM_YMD$/.test(k)), tk = fk && fk.replace("FROM", "TO");
  if (!key && fk && params[tk]) {
    const d8 = d => ymd(d).replace(/-/g, "");
    const part = async (f, t) => {
      const r = await one(Object.assign({}, params, { [fk]:f, [tk]:t }), 1);
      if (r.rows.length >= r.total || f >= t) { if (r.rows.length < r.total) out.partial = true; return r.rows; }
      const mid = addDays(parseYmd(ymdOf(f)), Math.floor(dayDiff(ymdOf(f), ymdOf(t)) / 2));
      return (await part(f, d8(mid))).concat(await part(d8(addDays(mid, 1)), t));
    };
    out.push(...await part(params[fk], params[tk]));
    return out;
  }
  for (let page = 1; page <= (maxPages || 1); page++) {
    const { rows, total } = await one(params, page);
    out.push(...rows);
    if (!key && out.length < total) { out.partial = true; break; }   // 키 없이는 2쪽을 달라 해도 1쪽이 또 온다
    if (!rows.length || out.length >= total || rows.length < size) break;
  }
  return out;
}
const htmlDecode = s => { const d = document.createElement("textarea"); d.innerHTML = s; return d.value; };
const ymdOf = d8 => `${d8.slice(0,4)}-${d8.slice(4,6)}-${d8.slice(6,8)}`;
const schoolYear = t => t.getMonth() + 1 >= 3 ? t.getFullYear() : t.getFullYear() - 1;
function taughtGrades(){
  const g = new Set(), hr = (S.settings.homeroom || "").match(/^(\d)/);
  if (hr) g.add(+hr[1]);
  for (let w = 1; w <= 5; w++) (S.timetable[w] || []).forEach(x => { const s = parseSlot(x), m = s && s.cls.match(/^(\d)-\d/); if (m) g.add(+m[1]); });

}
function mergeRuns(list){
  const out = [];
  for (const e of list.sort((a, b) => a.start.localeCompare(b.start))) {
    const prev = !e.end && out.find(m => m.title === e.title && dayDiff(m.end || m.start, e.start) >= 1 && dayDiff(m.end || m.start, e.start) <= 3 && [...Array(dayDiff(m.end || m.start, e.start) - 1)].every((_, i) => [0,6].includes(addDays(parseYmd(m.end || m.start), i + 1).getDay())));
    if (prev) prev.end = e.start; else out.push(Object.assign({}, e));

}
async function syncSchedule(){
  const sc = S.school, t = now(), sy = schoolYear(t);
  const rows = await neisGet("SchoolSchedule", { ATPT_OFCDC_SC_CODE:sc.atpt, SD_SCHUL_CODE:sc.code, AA_FROM_YMD:`${sy}0301`, AA_TO_YMD:`${sy+1}0228` }, 100);
  const grades = taughtGrades(), FK = ["ONE","TW","THREE","FR","FIV","SIX"], seen = new Set(), raw = [];
  for (const r of rows) {

    if (!title || /토요휴업일/.test(title)) continue;
    if (grades.length) { const flags = FK.map(k => r[k + "_GRADE_EVENT_YN"]); if (flags.some(f => f === "Y") && !grades.some(g => flags[g-1] === "Y")) continue; }
    const ds = ymdOf(r.AA_YMD), k = ds + "|" + title.replace(/\s/g, "");

function normDate(s){
  s = s.replace(/\([^)]*\)/g, "").replace(/[년월]\s*/g, "-").replace(/일/g, "").replace(/[./]/g, "-").replace(/-+$/, "").replace(/\s+/g, "").trim();
  const p = s.split("-").filter(x => x !== "").map(Number); let y, m, d;
  if (!p.length || p.some(isNaN)) return null;
  if (p.length === 3) { [y,m,d] = p; if (y < 100) y += 2000; }
  else if (p.length === 2) { [m,d] = p; const t = now(); const sy = t.getMonth()+1 >= 3 ? t.getFullYear() : t.getFullYear()-1; y = m >= 3 ? sy : sy+1; }
  else return null;
  const dt = new Date(y, m-1, d);
  if (dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return ymd(dt);
}
function parseEventLine(line){

  let e = "";
  if (mm[2]) {
    e = normDate(mm[2]);
    if (!e) { const d = String(mm[2]).replace(/\([^)]*\)/g, "").replace(/[.일\s]/g, ""); if (/^\d{1,2}$/.test(d)) { const sd = parseYmd(s), dt = new Date(sd.getFullYear(), sd.getMonth(), +d); if (dt.getDate() === +d) e = ymd(dt < sd ? new Date(sd.getFullYear(), sd.getMonth() + 1, +d) : dt); } }
    if (!e) return null;
  }
  let rest = mm[3], type = "기타";
  const tm = rest.match(/#(\S+)/);
  if (tm) { type = tm[1]; rest = rest.replace(tm[0], " "); }
  if (!EV_TYPES.includes(type)) type = ({ "공휴일":"휴일", "휴업":"휴일", "휴업일":"휴일", "재량휴업":"휴일", "고사":"시험", "평가":"시험" })[type] || "기타";
  let dday = false;

      if (S.plog[pk] === "skip") { delete S.plog[pk]; const i = a.indexOf(T); if (i >= 0) a.splice(i, 1); } else { S.plog[pk] = "skip"; a.push(T); } break; }
    case "tlog": { const k = b.dataset.k, subj = k.split("|").slice(1).join("|"), max = (S.lessons[subj] || []).length || 9999;
      S.done[k] = Math.min(max, (S.done[k] || 0) + 1); S.plog[`${T}|${b.dataset.p}`] = true; break; }
    case "task": { const id = b.dataset.id;
      if (id.startsWith("mg:")) { const k = id.slice(3), m = MG.find(x => x.id === k);
        if (mgLive && m) { m.done = !m.done; mgSend("done", k, m.done ? 1 : 0); } else S.mgDone[k] = !S.mgDone[k]; break; }
      const x = S.tasks.find(x => x.id === id); if (x) x.done = !x.done; break; }
    case "ttPick": applyTT(null, ttCands[+b.dataset.i]); return;
    case "taskDel": { const id = b.dataset.id;
      if (id.startsWith("mg:")) { const k = id.slice(3); if (mgLive) { MG = MG.filter(x => x.id !== k); mgSend("delete", k); } else S.mgHide[k] = true; break; }
      S.tasks = S.tasks.filter(x => x.id !== id); break; }
    case "calPrev": calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderPop(); return;
    case "calNext": calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderPop(); return;
    case "privacy": S.settings.privacy = !S.settings.privacy; closePop(); break;
    case "theme": S.settings.theme = effTheme() === "dark" ? "light" : "dark"; break;
    case "openSettings": openSettings(b.dataset.tab); return;
    case "closeSettings": closeSettings(); return;
    case "saveSettings": saveSettings(); return;
    case "tab": switchTab(b.dataset.tab); return;
    case "seg": b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); return;
    case "preset": PRESETS[b.dataset.k].forEach((p, i) => { $("#bS"+i).value = p[0]; $("#bE"+i).value = p[1]; });
      for (let i = PRESETS[b.dataset.k].length; i < ROWS; i++) { if (![1,2,3,4,5].some(w => $(`#t${i}_${w}`).value.trim())) { $("#bS"+i).value = ""; $("#bE"+i).value = ""; } }
      toast(`${b.dataset.k} 시정표를 넣었어요`); return;
    case "startWizard": closeWelcome(); openSettings(null, true); return;
    case "skipWelcome": closeWelcome(); return;
    case "wizNext": if (WIZ[wizStep] === "tt" && !collect()) return; $("#setErr").textContent = ""; wizStep++; switchTab(WIZ[wizStep]); renderFoot(); return;
    case "wizPrev": $("#setErr").textContent = ""; wizStep--; switchTab(WIZ[wizStep]); renderFoot(); return;
    case "testBanner": showBanner("3분 후 2교시", "2-3 국어 · 2-3교실", "알림이 이렇게 나타나요", 6000); return;
    case "export": exportData(); return;
    case "copyJson": try { navigator.clipboard.writeText(JSON.stringify(S)).then(() => toast("백업 내용을 복사했어요"), () => toast("복사하지 못했어요")); } catch(err) { toast("복사하지 못했어요"); } return;
    case "importText": importData($("#importText").value); return;
    case "reset":
      if (!resetArmed) { resetArmed = true; b.textContent = "한 번 더 누르면 지워져요"; setTimeout(() => { resetArmed = false; if (b.isConnected) b.textContent = "지우기"; }, 4000); return; }
      resetArmed = false; S = makeEmpty(); save(); closeSettings(); calMonth = null; renderAll(); openWelcome(); return;
    case "bannerOk": hideBanner(); return;
    case "quietClose": { const T = $("#quiet").dataset.t; if (quietKind === "pm") quietSnooze[T] = minOf(now()) + 10, fired.delete(T + "qpm"); hideQuiet(); return; }
    case "quietLater": { const T = $("#quiet").dataset.t; quietSnooze[T] = minOf(now()) + 10; fired.delete(T + "qpm"); hideQuiet(); toast("10분 뒤에 다시 알려 드릴게요"); return; }
    case "quietDone": { const T = $("#quiet").dataset.t; [...neisPendingDays(T), T].forEach(d => { S.attNeis[d] = true; const o = S.attNeisItems[d] = S.attNeisItems[d] || {}; Object.keys(S.att[d] || {}).forEach(n => o[n] = true); }); save(); renderAll(); showQuiet("pm", T); setTimeout(hideQuiet, 1600); return; }
    case "qItem": { toggleNeisItem(b.dataset.d, b.dataset.no); renderAll(); if (quietKind === "pm") { const T = $("#quiet").dataset.t; showQuiet("pm", T); if ([...neisPendingDays(T), T].every(d => S.attNeis[d])) setTimeout(hideQuiet, 1600); } return; }
    case "quietAllOk": S.attOk[$("#quiet").dataset.t] = true; save(); hideQuiet(); renderAll(); toast("오늘은 모두 출석으로 기록했어요"); return;
    case "quietGo": hideQuiet(); attView = "today"; renderAtt(now()); $("#pAtt").classList.add("pulse"); setTimeout(() => $("#pAtt").classList.remove("pulse"), 2400); return;
    case "testQuiet": showQuiet(b.dataset.v, ymd(now())); return;
    case "showPm": showQuiet("pm", ymd(now())); return;
    case "attAllOk": { const T = attYmd(); if (S.attOk[T]) delete S.attOk[T]; else S.attOk[T] = true; break; }
    case "popTab": popTab = b.dataset.v; renderPop(); return;
    case "progPick": openProg(b.dataset.k, b.closest(".pcard") || b); return;
    case "weekPlan": openWeek(b); return;
    case "wkMove": popWeek = +b.dataset.d ? popWeek + +b.dataset.d : 0; renderPop(); placePop(b); return;
    case "unitH": { const sj = b.dataset.s, U = S.units[sj], ui = +b.dataset.u, u = U.list[ui], dd = +b.dataset.d;
      const nh = Math.max(1, Math.min(6, u.h + dd)), delta = nh - u.h; if (!delta) return;
      const start = U.list.slice(0, ui).reduce((a, x) => a + x.h, 0);
      for (const key of Object.keys(S.done)) if (key.endsWith("|" + sj) && S.done[key] >= start + u.h) S.done[key] += delta;   // 이미 지난 반은 같은 단원 위치에
      u.h = nh; S.lessons[sj] = expandUnits(U); save(); renderAll(); renderPop(); return; }
    case "progSet": { const k = b.dataset.k, n = +b.dataset.n; S.done[k] = n; save(); renderAll(); renderPop(); return; }
    case "progStep": { const k = b.dataset.k, subj = k.slice(k.indexOf("|") + 1), max = (S.lessons[subj] || []).length || 9999; S.done[k] = Math.max(0, Math.min(max, (S.done[k] || 0) + (+b.dataset.d))); save(); renderAll(); renderPop(); return; }
    case "memoMode": memoMode = b.dataset.v; renderPop(); return;
    case "memoChip": { const [st, k] = memoKey(), toks = (S[st][k] || "").split(" · ").filter(Boolean), v = b.dataset.v, i = toks.indexOf(v); if (i >= 0) toks.splice(i, 1); else toks.push(v); setMemo(toks.join(" · ")); renderPop(); return; }
    case "memoClear": setMemo(""); renderPop(); return;
    case "memoDone": { const k = `${popPer.dk}|${popPer.p}`; if (S.memoDone[k]) delete S.memoDone[k]; else S.memoDone[k] = true; save(); renderAll(); renderPop(); return; }
    case "taskAll": openTask(b); return;
    case "calAll": openCal(b); return;
    case "attView": attView = b.dataset.v; renderAtt(now()); return;
    case "attDay": { const d = +b.dataset.d; closePop();
      if (!d) attOff = 0; else do { attOff = Math.min(0, attOff + d); } while (attOff && [0,6].includes(parseYmd(attYmd()).getDay()));
      renderAtt(now()); fitWidgets(); return; }
    case "attRange": attRange = b.dataset.v; renderAtt(now()); return;
    case "pickSchool": { const r = schoolResults[+b.dataset.i]; if (!r) return; S.school = r; S.neis.status = ""; save();
      $("#schoolRes").innerHTML = `<p class="impMsg ok">✓ ${esc(r.name)}와 연결했어요. 학사일정과 급식을 가져오는 중이에요.</p>`; $("#schoolNow").textContent = `${r.name} · ${r.office}`;
      syncNeis(true); return; }
    case "unlinkSchool": S.school = null; S.events = S.events.filter(e => e.src !== "neis"); S.meal = {}; S.neis.status = ""; save(); renderAll(); $("#schoolNow").textContent = "아직 연결하지 않았어요"; b.remove(); renderNeisStatus(); toast("학교 연결을 끊었어요"); return;
    case "neisSync": if (!S.school) { toast("먼저 학교를 찾아 골라 주세요"); return; } syncNeis(true); return;
    case "addPlan": { const box = b.closest(".row").querySelector("[data-plans]"); box.insertAdjacentHTML("beforeend", planRow({ date:b.dataset.date || "", title:b.dataset.title || "", upto:"" })); const last = box.lastElementChild.querySelector('[data-p="upto"]'); if (last) last.focus(); return; }

    case "impUndo": { const ids = new Set(impList.map(x => x.id)); S.events = S.events.filter(ev => !ids.has(ev.id)); impList.forEach(x => x.on = false);
      $$("[data-imp]").forEach(c => c.checked = false); syncImp(); return; }

document.addEventListener("submit", e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === "ovr") { const v = f.v.value.trim(); if (v) setOvr(v); }
  else if (kind === "memo") { setMemo(f.v.value); renderPop(); toast("메모를 저장했어요"); }
  else if (kind === "school") { const q = f.q.value.trim(); if (q.length >= 2) searchSchool(q); else toast("학교 이름을 두 글자 이상 적어 주세요"); }
  else if (kind === "nitem") { const t = f.t.value.trim(); if (!t) return; S.notice.items.push({ id:uid(), text:t, until:f.u.value || "" }); save(); openNotice(); }
});
document.addEventListener("change", e => { const k = e.target.dataset && e.target.dataset.nopt; if (!k) return; S.notice.opts[k] = e.target.checked; save(); buildNotice(); });
$("#taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, title = f.ttl.value.trim();
  if (!title) { f.ttl.focus(); return; }
  S.tasks.push({ id:uid(), title, due: f.due.value || ymd(now()), time: f.time.value || "", done:false });
  f.ttl.value = ""; f.time.value = ""; f.due.value = ymd(now());
  save(); renderAll();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  closePop(); hideBanner();
  if ($("#settings").classList.contains("open") && !wizard) closeSettings();
  if ($("#notice").classList.contains("open")) closeNotice();
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.settings.theme === "auto") renderAll(); }); } catch(e) {}

/* ---------- 시계 ---------- */
let lastMin = -1, lastDay = "";
function tick(){
  const t = now(), mi = t.getHours()*60 + t.getMinutes(), dk = ymd(t);
  if (dk !== lastDay) { lastDay = dk; prune(); calMonth = null; $("#taskForm").due.value = dk; setTimeout(() => syncNeis(false), 1500); }
  if (busy()) {} else if (mi !== lastMin) { lastMin = mi; loadMagam(); renderAll(); } else { renderStatus(t); if (t.getSeconds() % 10 === 0) loadMagam(); }   // 마감요정에서 지우거나 체크한 게 10초 안에 보이게(바뀐 게 있을 때만 다시 그림)
  checkAlerts(t); checkQuiet(t);
}
// 고침 파일(td-patch.js): 대시보드 폴더에 두면 켜질 때 한 번만 반영하고 기록해 둔다.
// Lively 안의 저장소는 밖에서 고칠 수 없어서, 설정을 대신 바꿔 줄 때 쓴다. 이미 반영한 id 는 다시 하지 않는다.
function loadPatch(){
  const s = document.createElement("script");
  s.src = "td-patch.js?" + Date.now();
  s.onload = () => {
    s.remove(); const P = window.TD_PATCH; S.patched = S.patched || {};
    if (!P || !P.id || S.patched[P.id]) return;
    try { P.run(S, { expandUnits, ymd, now }); S.patched[P.id] = ymd(now()); save(); renderAll(); toast(P.msg || "설정을 고쳤어요"); }
    catch(e) { toast("고침 파일을 반영하지 못했어요"); }
  };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}
paintIcons();
renderAll(); tick(); loadPatch();
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastMin = -1; tick(); } });
if (!S.settings.onboarded) openWelcome();
if (new URLSearchParams(location.search).has("debug")) window.__td = { extractProgressPlan, parseCfb, inflate, hwpBlocks, readAny, extractEvents, extractTimetable, htmlBlocks, textBlocks, tableRows };
save();
})();
